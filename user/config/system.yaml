absolute_urls: false

home:
  alias: '/usecases'

pages:
  theme: saturn
  process:
    markdown: true
    twig: false
  markdown:
    extra: true

cache:
  enabled: true
  check:
    method: file
  driver: auto
  prefix: 'g'

twig:
  cache: true
  debug: false
  auto_reload: true
  autoescape: true

assets:
  css_pipeline: false
  css_minify: true
  css_rewrite: true
  js_pipeline: false
  js_minify: true

errors:
  display: false
  log: true

debugger:
  enabled: false

# Trust Cloudflare's forwarded headers so Grav sees the real scheme/host
reverse_proxy_setup: true
